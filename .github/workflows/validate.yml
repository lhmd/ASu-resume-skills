name: Validate examples and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate checked-in examples
        run: |
          python skills/asu-resume-skill/scripts/validate_resume.py \
            --data examples/resume-data.example.json \
            --html examples/asu-resume-example.html \
            --pdf examples/asu-resume-example.pdf
          python skills/asu-resume-audit-skill/scripts/validate_report.py \
            --data examples/audit-report.example.json \
            --html examples/asu-resume-audit-example.html \
            --pdf examples/asu-resume-audit-example.pdf
